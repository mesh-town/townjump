name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.94"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the default six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The Windows image sets core.autocrlf=true, which would check text files out with CRLF,
      # while the help-text fixtures and golden files are compared with program output byte for
      # byte. Must run before checkout.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - name: Install toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that need Node and the JS reference (interop/setup-js.sh) are #[ignore]d, so this
      # step needs no Node setup on any OS.
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Check
        run: cargo "+$MSRV" check --workspace --all-targets --locked
