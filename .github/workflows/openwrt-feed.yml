name: openwrt-feed

# Builds the OpenWrt package feed (opkg .ipk and apk v3) from a published release and, on request, publishes it
# to the Pages branch. Called from release.yml after the release exists; also runnable by hand (publish defaults
# to false, so a manual run is a dry run). Without both signing secrets the feed is built with one-off keys and is
# never published.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.7
        type: string
        required: true
      pkg_release:
        description: Package revision
        type: string
        default: "1"
      publish:
        description: Publish the feed to the Pages branch
        type: boolean
        default: false
      strict:
        description: Fail when a release archive for any architecture label is missing
        type: boolean
        default: false
    secrets:
      OPENWRT_USIGN_KEY:
        required: false
      OPENWRT_APK_KEY:
        required: false
      OPENWRT_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.7
        type: string
        required: true
      pkg_release:
        description: Package revision
        type: string
        default: "1"
      publish:
        description: Publish the feed to the Pages branch
        type: boolean
        default: false
      strict:
        description: Fail when a release archive for any architecture label is missing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packaging/openwrt/**"
      - "scripts/dist/openwrt-build.sh"
      - "scripts/dist-check/**"
      - ".github/workflows/openwrt-feed.yml"
  pull_request:
    paths:
      - "packaging/openwrt/**"
      - "scripts/dist/openwrt-build.sh"
      - "scripts/dist-check/**"
      - ".github/workflows/openwrt-feed.yml"

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOWNJUMP_PKG_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git gcc meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev fakeroot openssl
      - name: Cache apk and usign
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: openwrt-tools-${{ hashFiles('packaging/openwrt/feed/tools.sh') }}
      - name: Build apk and usign
        run: |
          set -euo pipefail
          packaging/openwrt/feed/tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Shell scripts
        run: shellcheck scripts/dist/openwrt-build.sh packaging/openwrt/feed/tools.sh
      - name: Shared code tests
        run: python3 -m unittest discover -s packaging/openwrt/common -t packaging/openwrt/common
      - name: Feed tests under fakeroot, apk reads file owners
        run: fakeroot python3 -m unittest discover -s packaging/openwrt/feed -t packaging/openwrt/feed
      - name: Check and build script tests
        run: fakeroot python3 -m unittest discover -s scripts/dist-check -t scripts/dist-check

  build:
    name: build feed
    needs: test
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.build.outputs['signed'] }}
    env:
      TAG: ${{ inputs.tag }}
      PKG_RELEASE: ${{ inputs.pkg_release }}
      STRICT: ${{ inputs.strict }}
      GH_TOKEN: ${{ github.token }}
      OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
      OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1; }
          [[ "$PKG_RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pkg_release must be an integer > 0"; exit 1; }
      - name: Fetch the tag
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"
      - name: Download release archives
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir fetched \
            --pattern 'townjump-*-linux-musl*.tar.gz' --pattern SHA256SUMS
      - name: Build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git gcc meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev fakeroot openssl
      - name: Cache apk and usign
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: openwrt-tools-${{ hashFiles('packaging/openwrt/feed/tools.sh') }}
      - name: Build apk and usign
        run: |
          set -euo pipefail
          packaging/openwrt/feed/tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Signing keys
        run: |
          set -euo pipefail
          if [ -n "$OPENWRT_USIGN_KEY" ] && [ -n "$OPENWRT_APK_KEY" ]; then
            (umask 077
             printf '%s\n' "$OPENWRT_USIGN_KEY" > "$RUNNER_TEMP/usign.sec"
             printf '%s\n' "$OPENWRT_APK_KEY" > "$RUNNER_TEMP/apk.sec")
            echo "OPENWRT_USIGN_SEC=$RUNNER_TEMP/usign.sec" >> "$GITHUB_ENV"
            echo "OPENWRT_APK_SEC=$RUNNER_TEMP/apk.sec" >> "$GITHUB_ENV"
          else
            echo "::notice::signing secrets are not set: building with one-off keys, the feed will not be published"
            echo "EPHEMERAL=--ephemeral-keys" >> "$GITHUB_ENV"
          fi
      - name: Build
        id: build
        run: |
          set -euo pipefail
          flag=()
          if [ "$STRICT" = "true" ]; then flag+=(--strict); fi
          if [ -n "${EPHEMERAL:-}" ]; then flag+=("$EPHEMERAL"); fi
          fakeroot scripts/dist/openwrt-build.sh fetched out "${TAG#v}" "$PKG_RELEASE" "${flag[@]}"
      - name: Metadata leak check
        run: python3 scripts/dist-check/leak_check.py out/pages
      - uses: actions/upload-artifact@v4
        with:
          name: pages-openwrt
          path: out/pages
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: publish feed
    needs: build
    if: inputs.publish && needs.build.outputs['signed'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      OPENWRT_DEPLOY_KEY: ${{ secrets.OPENWRT_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-openwrt
          path: pages
      - name: Publish
        run: |
          set -euo pipefail
          if [ -z "$OPENWRT_DEPLOY_KEY" ]; then
            echo "::notice::OPENWRT_DEPLOY_KEY is not set: the feed is not published"
            exit 0
          fi
          # shellcheck source=/dev/null
          . packaging/openwrt/common/site.env
          (umask 077; printf '%s\n' "$OPENWRT_DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key")
          DEPLOY_KEY_FILE="$RUNNER_TEMP/deploy-key" \
            packaging/openwrt/common/publish_pages.sh - pages "$OPENWRT_GIT_URL" "$PAGES_BRANCH" "${TAG#v}"
