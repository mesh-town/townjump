name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish for real (only honored on a v* tag); the default is a dry run that builds everything and pushes nothing
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    name: check tag matches Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and workspace version
        id: v
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "cannot read version from Cargo.toml" >&2
            exit 1
          fi
          # A dry dispatch from a branch has no tag: the version comes from Cargo.toml alone.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: check-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            zig: false
          - target: x86_64-apple-darwin
            os: macos-15
            zig: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            zig: true
          - target: armv7-unknown-linux-musleabi
            os: ubuntu-24.04
            zig: true
            soft: true
          - target: mipsel-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
            mips: true
          - target: mips-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
            mips: true
          - target: aarch64-linux-android
            os: ubuntu-24.04
            zig: false
            android: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zig: false
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          # MIPS targets are tier 3 (no prebuilt std); scripts/mips/build.sh installs nightly with rust-src.
          if [ "${{ matrix.mips }}" != "true" ] && [ "${{ matrix.android }}" != "true" ]; then
            rustup target add "${{ matrix.target }}"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          # Pinned: the MIPS build was verified with zig 0.16.0; a newer zig or zigbuild
          # could change linking or libc behavior of released binaries without notice.
          pip3 install --user ziglang==0.16.0
          cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Install Android NDK and target
        if: matrix.android
        shell: bash
        run: |
          set -euo pipefail
          # NDK pinned: the Android build was verified with r28 (28.2.13676358), API level 24.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          # Without --toolchain the target lands in another toolchain and the build fails with "can't find crate for core".
          rustup target add --toolchain "$toolchain" aarch64-linux-android
      - name: Build (android)
        if: matrix.android
        shell: bash
        run: |
          set -euo pipefail
          bin="${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo build --release --locked -p townjump --target aarch64-linux-android
          out=$(file "target/aarch64-linux-android/release/townjump")
          echo "$out"
          # Foreign architecture: it cannot run here, so only the ELF header is checked.
          case "$out" in *aarch64*) ;; *) echo "not an aarch64 binary" >&2; exit 1;; esac
          case "$out" in */system/bin/linker64*) ;; *) echo "not linked against the Android linker" >&2; exit 1;; esac
      - name: Build (native)
        if: ${{ !matrix.zig && !matrix.android }}
        run: cargo build --release --locked -p townjump --target ${{ matrix.target }}
      - name: Build (zigbuild)
        if: matrix.zig && !matrix.mips && !matrix.soft
        run: cargo zigbuild --release --locked -p townjump --target ${{ matrix.target }}
      - name: Build (armv7 soft-float)
        if: matrix.soft
        env:
          CARGO_TARGET_DIR: target
        run: scripts/dist/armv7-soft-build.sh "${{ matrix.target }}"
      - name: Build (mips)
        if: matrix.mips
        env:
          CARGO_TARGET_DIR: target
        run: scripts/mips/build.sh "${{ matrix.target }}"
      - name: Binary name
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          bin=$(cargo metadata --no-deps --format-version 1 | jq -r --arg p townjump '.packages[]|select(.name==$p).targets[]|select(.kind==["bin"]).name')
          test -n "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          name="townjump-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ steps.bin.outputs.bin }}" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          name="townjump-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ steps.bin.outputs.bin }}.exe" LICENSE README.md "$name/"
          7z a -tzip "$name.zip" "$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  windows-installer:
    name: windows installer
    needs: [check-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - uses: actions/download-artifact@v4
        with:
          name: asset-x86_64-pc-windows-msvc
          path: win
      - name: Build installer
        run: |
          scripts/dist/windows-installer.sh "win/townjump-${VERSION}-x86_64-pc-windows-msvc.zip" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: asset-windows-installer
          path: out/townjump-setup-${{ needs.check-tag.outputs.version }}.exe
          if-no-files-found: error

  publish:
    name: publish release
    needs: [check-tag, build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
      TOWNJUMP_DIST_REPO: ${{ vars.DIST_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix="townjump-${VERSION}/" \
            -o "dist/townjump-${VERSION}.tar.gz" "${GITHUB_REF_NAME}"
      - name: Checksums
        run: scripts/dist/publish.sh sums dist
      - name: Create release
        run: scripts/dist/publish.sh release "$VERSION" dist

  tap:
    name: Homebrew tap
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/tap-bump.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}
      dist-repo: ${{ vars.DIST_REPO || github.repository }}
    secrets:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

  npm:
    name: npm
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Download release assets
        run: gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir npm-assets
      - name: Build packages
        run: node npm/build.mjs "$VERSION" npm-assets npm-out
      - name: Publish
        run: |
          set -euo pipefail
          # Platform packages first, the main package last; a version that is already in the
          # registry is skipped, so rerunning the job is safe.
          dirs=()
          for path in npm-out/*/; do
            dir=$(basename "$path")
            if [ "$dir" != townjump ]; then dirs+=("$dir"); fi
          done
          for dir in "${dirs[@]}" townjump; do
            name=$(node -p "require('./npm-out/$dir/package.json').name")
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published, skipping"
              continue
            fi
            (cd "npm-out/$dir" && npm publish --access public --provenance)
          done

  winget:
    name: winget
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}
      dist-repo: ${{ vars.DIST_REPO || github.repository }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  deb:
    name: Debian apt repository
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/deb.yml
    with:
      tag: ${{ github.ref_name }}
      pkg_release: "1"
      publish: true
    secrets:
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
      DIST_DEPLOY_KEY: ${{ secrets.DIST_DEPLOY_KEY }}

  openwrt-feed:
    name: OpenWrt feed
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/openwrt-feed.yml
    with:
      tag: ${{ github.ref_name }}
      pkg_release: "1"
      publish: true
      strict: true
    secrets:
      OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
      OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
      OPENWRT_DEPLOY_KEY: ${{ secrets.OPENWRT_DEPLOY_KEY }}

  keenetic-feed:
    name: Keenetic feed
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/keenetic-feed.yml
    with:
      tag: ${{ github.ref_name }}
      pkg_release: "1"
      publish: true
      strict: true
    secrets:
      KEENETIC_DEPLOY_KEY: ${{ secrets.KEENETIC_DEPLOY_KEY }}

  # Jobs below run after the release exists. `deb` and `dist` do not wait for each other:
  # the shared concurrency group and the lease on the target branch keep their pushes in order.
  dist:
    name: direct downloads
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
    uses: ./.github/workflows/dist.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}
      publish: true
    secrets:
      DIST_DEPLOY_KEY: ${{ secrets.DIST_DEPLOY_KEY }}

  container-image:
    name: container image
    needs: [check-tag, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}
      publish: true
