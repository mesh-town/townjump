name: check-dist

on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/dist/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/tap-bump.yml"
      - ".github/workflows/winget.yml"
      - ".github/workflows/check-dist.yml"
      - ".github/workflows/**"
      - "scripts/dist-check/**"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/dist/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/tap-bump.yml"
      - ".github/workflows/winget.yml"
      - ".github/workflows/check-dist.yml"
      - ".github/workflows/**"
      - "scripts/dist-check/**"

permissions:
  contents: read

jobs:
  scripts:
    name: scripts and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS and PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis shellcheck
          command -v pwsh || sudo snap install powershell --classic
      - name: Script tests
        run: |
          set -euo pipefail
          shellcheck scripts/dist/*.sh
          for t in scripts/dist/*-test.sh; do
            echo "== $t"
            "$t"
          done
      - name: Workflow wiring tests
        run: cd scripts/dist-check && python3 -m unittest test_workflows test_release_callers test_dist_tree_check
      - name: Key tooling tests (with usign)
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev fakeroot
          packaging/openwrt/feed/tools.sh "$RUNNER_TEMP/tools"
          USIGN="$RUNNER_TEMP/tools/bin/usign" TOWNJUMP_PKG_REQUIRE_TOOLS=1 scripts/dist/gen-keys-test.sh
      - name: PATH entry tests
        run: pwsh -NoProfile -NonInteractive -File packaging/windows/path-entry.tests.ps1
      - name: Winget manifests against the schema
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install jsonschema pyyaml
          mkdir -p "$RUNNER_TEMP/schema"
          for t in installer version defaultLocale; do
            curl -fsSL -o "$RUNNER_TEMP/schema/winget-manifest.$t.1.10.0.schema.json" \
              "https://aka.ms/winget-manifest.$t.1.10.0.schema.json"
          done
          fake="$RUNNER_TEMP/fake"
          scripts/dist/fake-release.sh 1.2.3 "$fake"
          scripts/dist/winget.sh render 1.2.3 "$fake/townjump-setup-1.2.3.exe" "$RUNNER_TEMP/manifests"
          "$RUNNER_TEMP/venv/bin/python" -I scripts/dist/winget-schema-check.py \
            "$RUNNER_TEMP/schema" "$RUNNER_TEMP/manifests"

  brew:
    name: Homebrew formula
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fixture release
        run: scripts/dist/fake-release.sh 1.2.3 "$RUNNER_TEMP/rel"
      - name: Style and audit
        run: scripts/dist/brew-check.sh
      - name: Install from the fixture
        run: scripts/dist/brew-check.sh --install "$RUNNER_TEMP/rel" 1.2.3
