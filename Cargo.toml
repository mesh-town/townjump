# Root workspace of townjump. The peeroxide fork (fork/peeroxide) is a separate workspace, pulled in via path dependencies.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fork"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.94"
authors = ["Mesh Town <meshtown.app@gmail.com>"]
repository = "https://github.com/mesh-town/townjump"
homepage = "https://github.com/mesh-town/townjump"
readme = "README.md"
keywords = ["holesail", "p2p", "dht", "tunnel", "hyperswarm"]
categories = ["network-programming", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"

# our crates
townjump-jsval = { path = "crates/townjump-jsval" }
townjump-keys = { path = "crates/townjump-keys" }
townjump-logger = { path = "crates/townjump-logger" }
townjump-dht = { path = "crates/townjump-dht" }
townjump-pipe = { path = "crates/townjump-pipe" }
townjump-server = { path = "crates/townjump-server" }
townjump-client = { path = "crates/townjump-client" }
townjump-dht-peeroxide = { path = "crates/townjump-dht-peeroxide" }
townjump-filemanager = { path = "crates/townjump-filemanager" }
townjump-testkit = { path = "crates/townjump-testkit" }

# peeroxide fork (fork/peeroxide): only these two crates are used
libudx = { path = "fork/peeroxide/libudx" }
peeroxide-dht = { path = "fork/peeroxide/peeroxide-dht" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "warn"
