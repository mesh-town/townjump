[package]
name = "townjump"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The `townjump` binary: CLI and the `Holesail` facade."

[[bin]]
name = "townjump"
path = "src/main.rs"

[dependencies]
townjump-jsval.workspace = true
townjump-keys.workspace = true
townjump-logger.workspace = true
townjump-dht.workspace = true
townjump-pipe.workspace = true
townjump-server.workspace = true
townjump-client.workspace = true
townjump-dht-peeroxide.workspace = true
townjump-filemanager.workspace = true
tokio = { workspace = true, features = ["signal"] }
thiserror.workspace = true
hex.workspace = true
getrandom = "0.3"
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
townjump-testkit.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
